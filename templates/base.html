{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}SocialHub{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'social/css/style.css' %}"
    >

</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a
            href="{% url 'home' %}"
            class="brand"
        >
            Social<span>Hub</span>
        </a>


        {% if user.is_authenticated %}

        <form
            action="{% url 'search' %}"
            method="GET"
            class="search-form"
        >

            <input
                type="text"
                name="q"
                placeholder="Search users..."
                autocomplete="off"
            >

            <button type="submit">
                Search
            </button>

        </form>


        <nav class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'profile' user.username %}">
                Profile
            </a>

            <a href="{% url 'edit_profile' %}">
                Edit
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        </nav>

        {% endif %}

    </div>

</header>


<main class="main-container">

    {% if messages %}

        {% for message in messages %}

            <div class="message {{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    {% block content %}{% endblock %}

</main>


<script src="{% static 'social/js/script.js' %}"></script>

</body>
</html>
