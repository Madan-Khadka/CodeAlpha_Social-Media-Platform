{% extends "social/base.html" %}

{% block title %}Login | SocialHub{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-logo">
            Social<span>Hub</span>
        </div>

        <h1>Welcome back</h1>

        <p class="muted">
            Login to continue to SocialHub.
        </p>


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required
                    placeholder="Enter username"
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                    placeholder="Enter password"
                >

            </div>


            <button
                type="submit"
                class="primary-btn full-btn"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create account
            </a>

        </p>

    </div>

</div>

{% endblock %}
